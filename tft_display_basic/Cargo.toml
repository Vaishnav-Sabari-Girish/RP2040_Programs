[package]
name = "tft_display_basic"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = "0.7.9"
cortex-m-rt = "0.7.6"
embedded-alloc = "0.7.0"
embedded-graphics = "0.8.2"
embedded-hal = "1.0.0"
embedded-hal-bus = "0.3.0"
fugit = "0.6.0"
mipidsi = "0.10.0"
mousefood = { version = "0.5.2", default-features = false, features = ["fonts"] }
panic-halt = "1.0.0"
portable-atomic = { version = "1.15.0", features = ["critical-section"] }
ratatui = { version = "0.30.2", default-features = false, features = ["portable-atomic"] }
rp2040-boot2 = "0.3.0"
rp2040-hal = { version = "0.12.0", features = ["critical-section-impl"] }

[[bin]]
name = "tft_display_basic"
test = false
bench = false
doctest = false

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

[patch.crates-io]
ratatui-widgets = { path = "patches/ratatui-widgets" }
